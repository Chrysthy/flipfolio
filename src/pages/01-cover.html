<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover</title>
</head>

<body>
    <!-- COVER: TECH / CIRCUIT THEME -->
    <div class="page page-cover" data-density="hard">
        <div class="page-content cover-content">
            <span class="cover-eyebrow">PORTFOLIO</span>

            <div class="hero-stars">
                <span class="star s1"></span>
                <span class="star s2"></span>
                <span class="star s3"></span>
                <span class="star s4"></span>
                <span class="star s5"></span>
                <span class="star s6"></span>
                <span class="star s7"></span>
                <span class="star s8"></span>
                <span class="star s9"></span>
                <span class="star s10"></span>
                <span class="star s11"></span>
                <span class="star s12"></span>
            </div>

            <div class="cover-body">
                <div class="hero-tech">
                    <div class="core-glow"></div>
                    <div class="core-ring ring1"></div>
                    <div class="core-ring ring2"></div>
                    <div class="core-ring ring3"></div>

                    <svg class="laptop-silhouette" viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg">
                        <rect x="45" y="14" width="110" height="78" rx="8" class="laptop-screen-glass" />
                        <rect x="52" y="21" width="96" height="64" rx="4" class="laptop-screen-inner" />
                        <path d="M30 96 L170 96 L182 118 Q182 124 176 124 L24 124 Q18 124 18 118 Z"
                            class="laptop-base-glass" />
                        <rect x="90" y="108" width="20" height="4" rx="2" class="laptop-notch" />
                    </svg>

                    <div class="side-icons side-left">
                        <div class="side-icon float-1"><img
                                src="https://raw.githubusercontent.com/devicons/devicon/master/icons/react/react-original.svg"
                                alt="React"></div>
                        <div class="side-icon float-2"><img
                                src="https://raw.githubusercontent.com/devicons/devicon/master/icons/git/git-original.svg"
                                alt="Git"></div>
                        <div class="side-icon float-3"><img
                                src="https://raw.githubusercontent.com/devicons/devicon/master/icons/nodejs/nodejs-original.svg"
                                alt="Node.js"></div>
                    </div>
                    <div class="side-icons side-right">
                        <div class="side-icon float-2"><img
                                src="https://raw.githubusercontent.com/devicons/devicon/master/icons/python/python-original.svg"
                                alt="Python"></div>
                        <div class="side-icon float-1"><img
                                src="https://raw.githubusercontent.com/devicons/devicon/master/icons/javascript/javascript-plain.svg"
                                alt="JavaScript"></div>
                        <div class="side-icon float-3"><img
                                src="https://registry.npmmirror.com/@lobehub/icons-static-png/latest/files/dark/n8n.png"
                                alt="n8n"></div>
                    </div>
                </div>

                <h1 class="cover-title">CHRYSTINE<br>MARTINS</h1>
                <p class="cover-tagline">Code • Automation • AI</p>
                <div class="hero-divider"></div>
                <h2 class="cover-subtitle"><span id="typing-text"></span><span class="cursor">|</span></h2>
            </div>
            <span class="cover-footer">Drag a corner or use the arrows to turn the page →</span>
        </div>
    </div>
</body>

</html>
